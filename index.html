<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do Webpage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
    <span class="blob blob-4"></span>
  </div>

  <main class="app">
    <!-- header -->
    <header class="app-header">
      <div class="title-wrap">
        <span class="sparkle">✧</span>
        <h1><span id="typedTitle"></span><span class="caret" id="caret">|</span></h1>
        <span class="sparkle">✧</span>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span class="toggle-track">
          <span class="toggle-thumb" id="toggleThumb">🌙</span>
        </span>
      </button>
    </header>

    <!-- progress -->
    <section class="progress-card">
      <div class="progress-top">
        <div class="progress-label">
          
          <span>Your progress</span>
        </div>
        <span class="progress-percent" id="progressPercent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-buddy" id="progressBuddy">🐣</div>
      </div>
      <p class="progress-msg" id="progressMsg">Let's get started! </p>
    </section>

    <!-- add task -->
    <section class="add-card" id="addCard">
      <div class="add-row add-row-top">
        
        <input type="text" id="taskTitle" class="title-input" placeholder="What's on your mind today?" autocomplete="off" />
      </div>
      <div class="add-row add-row-bottom">
        <label class="chip-input">
          
          <input type="datetime-local" id="taskDate" />
        </label>
        <label class="chip-input">
          
          <select id="taskPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </label>
        <label class="chip-input">
          
          <input type="text" id="taskTags" placeholder="tags, here" />
        </label>
        <button class="add-btn" id="addTaskBtn">
          <i class="fas fa-plus"></i>
          <span id="addBtnLabel">Add</span>
        </button>
        <button class="cancel-btn hidden" id="cancelEditBtn" type="button">
          <i class="fas fa-xmark"></i>
          <span>Cancel</span>
        </button>
      </div>
    </section>

    <!-- filters -->
    <nav class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">
        <span class="filter-emoji"></span> All
      </button>
      <button class="filter-btn" data-filter="active">
        <span class="filter-emoji"></span> Active
      </button>
      <button class="filter-btn" data-filter="completed">
        <span class="filter-emoji"></span> Done
      </button>
    </nav>

    <!-- task list -->
    <ul class="task-list" id="taskList"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
